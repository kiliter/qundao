function field(label,key,value,type='text',placeholder=''){return '<label class="field">'+label+'<input type="'+type+'" data-connection="'+key+'" value="'+esc(value)+'" placeholder="'+esc(placeholder)+'" autocomplete="off"></label>';}
function renderConnection(){const c=S.connection;$('#pageBody').innerHTML='<div class="settings-scroll"><div class="settings-grid"><section class="setting-panel"><h3>消息来源 · Alpha</h3><p>通过 HTTP REST 读取群聊，SSE 接收新消息。</p>'+field('服务地址','alpha',c.alpha)+field('访问令牌','alphaKey','','password','原型无需填写真实令牌')+'<label class="field">微信账号<select data-connection="account"><option>'+c.account+'</option></select></label>'+button('保存并连接','connect-alpha','primary','link')+'<div class="connection-mark"><i></i>连接状态：演示已连接</div></section><section class="setting-panel"><h3>摘要模型 · CPA</h3><p>生成完整未读摘要；超出预算时分段处理。</p>'+field('模型目录 · model_catalog_url','catalog',c.catalog)+field('CPA API Key','cpaKey','','password','原型无需填写真实密钥')+'<label class="field">摘要模型<select data-connection="cpaModel">'+['示例摘要模型','示例轻量模型'].map(v=>'<option '+(c.cpaModel===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="field">推理强度<select data-connection="reasoning">'+['低','中','高'].map(v=>'<option '+(c.reasoning===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><div class="row wrap">'+button('保存并获取模型','connect-cpa','primary','refresh')+button('从 Codex 导入','import-key','flat')+'</div></section><section class="setting-panel wide"><h3>决策模型 · Jev</h3><p>独立选择判断服务、接口协议和密钥；摘要仍由 CPA 生成。</p><div class="radio-row">'+['OpenRouter','TypeSafe','自定义'].map(v=>'<button class="radio-btn '+(c.provider===v?'on':'')+'" data-provider="'+v+'">'+v+'</button>').join('')+'</div><div class="settings-grid" style="gap:0 22px">'+field('Base URL','base',c.base)+'<label class="field">接口协议<select data-connection="protocol"><option '+(c.protocol==='OpenRouter'?'selected':'')+'>OpenRouter</option><option '+(c.protocol==='TypeSafe'?'selected':'')+'>TypeSafe</option></select></label>'+field('模型名称','model',c.model)+field('独立 API Key','jevKey','','password','原型无需填写真实密钥')+'</div><div class="row wrap">'+button('保存决策配置','save-jev','primary','check')+button('测试连接','test-jev','','link')+'</div></section><div class="note-box" style="grid-column:1/-1;margin:0">原型中的表单仅用于交互演示，不发送网络请求、不读取或保存真实密钥。正式应用的诊断日志包含白名单聊天正文，鉴权密钥会隐藏。</div></div></div>';}
const LOGS=[
 {source:'CPA 摘要',time:'16:42:08',event:'完整未读摘要生成成功',status:'200',duration:'1,280 ms',input:{群聊:'产品研发群',消息条数:4,触发来源:'即时',消息:'合成示例：明天评审，需要补充流程图。'},output:{相关:true,摘要:'明天 10:00 评审，需要补充鉴权流程图。',证据:['示例消息1','示例消息3']}},
 {source:'Jev 判断',time:'16:42:06',event:'相关性判断完成',status:'200',duration:'640 ms',input:{群聊:'产品研发群',本地命中:'明确提及',候选条数:3},output:{相关概率:0.94,需回应:true}},
 {source:'Alpha',time:'16:42:04',event:'完整未读快照读取完成',status:'200',duration:'82 ms',input:{群聊:'产品研发群',范围:'全部未读',页数:1},output:{消息条数:4,分页完成:true}},
 {source:'运行事件',time:'16:41:56',event:'白名单消息进入缓冲',status:'—',duration:'—',input:{群聊:'产品研发群',新消息数:3,缓冲截止:'16:42:04'},output:{重复消息:0,等待秒数:8}}
];
function logs(){return Array.from({length:3},(_,i)=>LOGS.map((l,j)=>({...l,key:i*4+j,time:i===0?l.time:'15:'+String(30-i*7).padStart(2,'0')+':'+String(j*12).padStart(2,'0')}))).flat().filter(l=>S.logSource==='全部来源'||l.source===S.logSource);}
function renderLogs(){const records=logs(),limit=Math.min(S.logSize,records.length),start=S.logPage*limit,shown=records.slice(start,start+limit);if(!shown.some(l=>l.key===S.logIndex))S.logIndex=shown[0]?.key||0;$('#pageBody').innerHTML='<div class="toolbar"><select aria-label="日志来源" id="logSource">'+['全部来源','CPA 摘要','Jev 判断','Alpha','运行事件'].map(v=>'<option '+(v===S.logSource?'selected':'')+'>'+v+'</option>').join('')+'</select><label class="check"><input type="checkbox" data-setting="live" '+(S.live?'checked':'')+'>实时刷新</label><label class="check"><input type="checkbox" data-setting="follow" '+(S.follow?'checked':'')+'>跟随最新</label><span class="grow"></span>'+button('刷新','refresh-logs','mini','refresh')+'</div><div class="log-notice">诊断详情可能包含聊天原文；密钥隐藏。以下为合成演示记录。</div><div class="log-layout"><aside class="log-list">'+shown.map(l=>'<button class="log-item '+(l.key===S.logIndex?'selected':'')+'" data-log="'+l.key+'"><div class="row"><span class="tag '+(l.source==='CPA 摘要'?'red':'soft')+'">'+l.source+'</span><span class="grow"></span><time class="small muted">'+l.time+'</time></div><div class="log-title">'+l.event+'</div><div class="log-meta">HTTP '+l.status+'　·　'+l.duration+'</div></button>').join('')+'</aside><section class="log-detail" id="logDetail"></section></div><div class="pagination"><span>'+(S.live?(S.follow?'实时刷新 · 跟随最新':'实时刷新 · 保持当前详情'):'已暂停实时刷新')+'</span><span class="grow"></span><select aria-label="日志每页条数" id="logSize">'+[5,25,50,100].map(n=>'<option value="'+n+'" '+(S.logSize===n?'selected':'')+'>'+n+' 条 / 页</option>').join('')+'</select>'+button('上一页','log-prev','mini')+'<span>第 '+(S.logPage+1)+' 页</span>'+button('下一页','log-next','mini')+'</div>';$('[data-act="log-prev"]').disabled=S.logPage===0;$('[data-act="log-next"]').disabled=start+limit>=records.length;renderLogDetail();}
function renderLogDetail(){const l=logs().find(l=>l.key===S.logIndex)||logs()[0];logContent=S.logTab==='错误'?'本次请求没有错误。':JSON.stringify(S.logTab==='入参'?l.input:l.output,null,S.json?2:0);$('#logDetail').innerHTML='<h3>'+l.event+'</h3><p class="small muted">10 月 22 日 '+l.time+' · '+l.source+'</p><div class="radio-row" style="margin-top:20px">'+['入参','出参','错误'].map(v=>'<button class="radio-btn '+(S.logTab===v?'on':'')+'" data-log-tab="'+v+'">'+v+'</button>').join('')+'<span class="grow"></span><button class="icon-btn" data-act="copy-log" aria-label="复制日志内容">'+icon('copy')+'</button></div><div class="row wrap"><label class="check"><input type="checkbox" data-setting="json" '+(S.json?'checked':'')+'>展开 JSON</label><label class="check"><input type="checkbox" data-setting="wrap" '+(S.wrap?'checked':'')+'>自动换行</label></div><pre class="'+(S.wrap?'':'nowrap')+'">'+esc(logContent)+'</pre>';}
function openDialog(html){modalReturn=document.activeElement;$('#modal').innerHTML='<div class="dialog-inner">'+html+'</div>';$('#modal').showModal();}
function closeDialog(){$('#modal').close();if(modalReturn?.isConnected)modalReturn.focus();}
function dialogHead(title,sub){return '<header class="dialog-head"><div><h2 id="dialogTitle">'+title+'</h2><p>'+sub+'</p></div><button class="icon-btn" data-act="close-dialog" aria-label="关闭弹窗">'+icon('close')+'</button></header>';}
function openSource(id){const r=S.records.find(r=>r.id===id);if(!r)return;openDialog(dialogHead(group(r.group).name,'本批原文 · '+r.messages.length+' 条合成消息')+'<div class="dialog-scroll">'+r.messages.map(m=>'<article class="chat '+(m.sender==='林工'?'mine':'')+'"><span class="avatar">'+m.sender[0]+'</span><div class="chat-content"><p class="chat-meta">'+esc(m.sender)+' · '+m.time+'</p><div class="bubble '+(m.highlight?'highlight':'')+'">'+esc(m.text)+'</div></div></article>').join('')+'</div><footer class="dialog-foot">'+icon('shield')+'阅读原文不会改变微信未读状态<span class="grow"></span>'+button('关闭','close-dialog','primary')+'</footer>');}
function openAdd(){S.addSearch='';S.addSelected=new Set();openDialog(dialogHead('添加到监听白名单','打开即列出全部可添加群；搜索仅用于筛选。')+'<div class="toolbar"><label class="search box" style="flex:1">'+icon('search')+'<input id="addSearch" placeholder="搜索群聊" aria-label="搜索可添加群"></label></div><div class="toolbar">'+button('全选当前列表','select-add','mini')+button('清空选择','clear-add','flat mini')+'</div><div class="dialog-scroll"><div class="add-list" id="addList"></div></div><footer class="dialog-foot"><span id="addCount"></span><span class="grow"></span>'+button('取消','close-dialog')+button('添加已选','confirm-add','primary','plus')+'</footer>');renderAdd();}
function addRows(){return S.groups.filter(g=>!S.whitelist.has(g.id)&&g.name.includes(S.addSearch));}
function renderAdd(){$('#addList').innerHTML=addRows().map(g=>'<label class="add-item"><input type="checkbox" data-add="'+g.id+'" '+(S.addSelected.has(g.id)?'checked':'')+' aria-label="添加 '+g.name+'"><span class="avatar">'+g.name[0]+'</span>'+g.name+'<span class="muted">微信 '+g.unread+'</span></label>').join('')||'<div class="empty"><p>没有可添加的群聊</p></div>';$('#addCount').textContent='可添加 '+addRows().length+' 个 · 已选 '+S.addSelected.size+' 个';$('[data-act="confirm-add"]').disabled=!S.addSelected.size;$('[data-act="confirm-add"]').innerHTML=icon('plus')+'添加已选 '+S.addSelected.size+' 个群';}
function pushDemo(){const g=S.groups.find(g=>S.whitelist.has(g.id));if(!g){toast('先添加一个演示白名单群');return;}S.tick++;const r={id:'new'+S.tick,group:g.id,time:'17:'+String(S.tick).padStart(2,'0'),title:'评审材料有更新，请确认最新附件',body:'新增一条合成关注：评审清单补充了回滚验证环节，需要你确认负责的接口是否覆盖。请按最新清单准备材料。',reason:'演示消息明确提到你的负责范围。',tags:['明确找你','需回应'],related:true,state:'pending',messages:[msg('阿宁','17:'+String(S.tick).padStart(2,'0'),'@林工 评审清单增加了回滚验证，请确认负责的接口是否覆盖。',true)]};S.records.unshift(r);g.unread++;if(S.page==='attention'||S.page==='summary')render();else renderNav();if(!S.prefs.quiet){$('#cutin').classList.remove('play');void $('#cutin').offsetWidth;$('#cutin').classList.add('play');}toast('新增 1 条演示关注 · 已阅记录不会重新亮点');}
function startFlow(){if(!S.running){toast('请先开始演示监听');return;}flowTimers.forEach(clearTimeout);[['buffer',0],['jev',1000],['summary',2200],['idle',3900]].forEach(([phase,delay])=>flowTimers.push(setTimeout(()=>{S.phase=phase;renderNav();if(phase==='idle')toast('演示检查完成 · 没有新增末条，不重复生成');},delay)));toast('正在演示：缓冲 → Jev 判断 → CPA 摘要');}
function navigate(page){S.page=page;S.search='';render();}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){navigate(b.dataset.page);return;}if(b.dataset.group){S.group=b.dataset.group;renderGroupList();return;}if(b.dataset.source){openSource(b.dataset.source);return;}if(b.dataset.read){markRead([b.dataset.read],b.dataset.read);return;}if(b.dataset.chip){S[b.dataset.chip].splice(Number(b.dataset.index),1);renderRules();return;}if(b.dataset.method){S.prefs.method=b.dataset.method;renderRules();return;}if(b.dataset.provider){S.connection.provider=b.dataset.provider;S.connection.protocol=b.dataset.provider==='TypeSafe'?'TypeSafe':'OpenRouter';S.connection.base=b.dataset.provider==='OpenRouter'?'https://openrouter.ai/api':'https://service.example.invalid';renderConnection();return;}if(b.dataset.log!==undefined){S.logIndex=Number(b.dataset.log);S.follow=false;renderLogs();return;}if(b.dataset.logTab){S.logTab=b.dataset.logTab;renderLogDetail();return;}
const a=b.dataset.act;if(!a)return;
switch(a){
case'close-dialog':closeDialog();break;
case'allread':markRead((S.page==='attention'?pending():visibleRecords().filter(r=>r.state==='pending')).map(r=>r.id));break;
case'group-read':markRead(entriesFor(S.group).filter(r=>r.state==='pending').map(r=>r.id));break;
case'clear-search':S.search='';renderReader();break;
case'push':pushDemo();break;
case'generate':startFlow();break;
case'add-groups':openAdd();break;
case'select-add':addRows().forEach(g=>S.addSelected.add(g.id));renderAdd();break;
case'clear-add':S.addSelected.clear();renderAdd();break;
case'confirm-add':S.addSelected.forEach(id=>S.whitelist.add(id));closeDialog();render();toast('已添加 '+S.addSelected.size+' 个演示群聊');break;
case'remove-groups':{const n=S.selected.size;S.selected.forEach(id=>S.whitelist.delete(id));S.selected.clear();render();toast('已移出 '+n+' 个演示群 · 历史摘要保留');break;}
case'sort-groups':S.sortAsc=!S.sortAsc;renderGroups();break;
case'reset-width':S.prefs.compact=300;S.prefs.expanded=440;renderAppearance();toast('已恢复演示默认尺寸');break;
case'connect-alpha':case'connect-cpa':case'save-jev':case'test-jev':toast('演示配置已应用 · 未发起真实连接');break;
case'import-key':toast('原型不读取 Codex 密钥');break;
case'refresh-logs':S.logPage=0;if(S.follow)S.logIndex=0;renderLogs();toast('演示日志已刷新');break;
case'log-prev':S.follow=false;S.logPage=Math.max(0,S.logPage-1);renderLogs();break;
case'log-next':S.follow=false;S.logPage++;renderLogs();break;
case'copy-log':try{await navigator.clipboard.writeText(logContent);toast('已复制合成日志');}catch{toast('浏览器未允许复制，可直接选择日志文字。');}break;
case'archive':openDialog(dialogHead('日志归档','仅展示合成归档，不读取本机日志。')+'<div class="dialog-scroll"><table class="data-table"><thead><tr><th>归档文件</th><th>内容</th></tr></thead><tbody><tr><td>示例日志-2026-10-22.jsonl</td><td>当天处理记录</td></tr><tr><td>示例日志-2026-10-21.jsonl</td><td>历史处理记录</td></tr></tbody></table><div class="note-box">正式应用通过此入口打开本地日志归档目录。</div></div><footer class="dialog-foot"><span class="grow"></span>'+button('关闭','close-dialog','primary')+'</footer>');break;
}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.setting){S[t.dataset.setting]=t.checked;if(['history','onlyRelated'].includes(t.dataset.setting))render();else if(['json','wrap'].includes(t.dataset.setting))renderLogDetail();else {if(t.dataset.setting==='follow'&&t.checked){S.logPage=0;S.logIndex=0;}renderLogs();}}if(t.dataset.pref){S.prefs[t.dataset.pref]=t.checked;if(t.dataset.pref==='reduced')document.body.classList.toggle('reduced',t.checked);toast('已更新演示设置');}if(t.dataset.white){t.checked?S.selected.add(t.dataset.white):S.selected.delete(t.dataset.white);renderGroups();}if(t.dataset.instant){group(t.dataset.instant).instant=t.checked;toast('即时识别已'+(t.checked?'开启':'关闭')+' · 演示');}if(t.dataset.add){t.checked?S.addSelected.add(t.dataset.add):S.addSelected.delete(t.dataset.add);renderAdd();}if(t.dataset.connection&&!t.dataset.connection.endsWith('Key'))S.connection[t.dataset.connection]=t.value;if(t.dataset.demo){S.prefs.interval=Number(t.value);toast(t.dataset.demo+'已更新 · 演示');}if(t.id==='selectWhiteAll'){S.groups.filter(g=>S.whitelist.has(g.id)&&g.name.includes(S.groupSearch)).forEach(g=>t.checked?S.selected.add(g.id):S.selected.delete(g.id));renderGroups();}if(t.id==='logSource'){S.logSource=t.value;S.logPage=0;renderLogs();}if(t.id==='logSize'){S.logSize=Number(t.value);S.logPage=0;renderLogs();}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='groupSearch'){S.search=t.value;renderGroupList();}if(t.id==='whiteSearch'){S.groupSearch=t.value;const pos=t.selectionStart;renderGroups();$('#whiteSearch').focus();$('#whiteSearch').setSelectionRange(pos,pos);}if(t.id==='addSearch'){S.addSearch=t.value;renderAdd();}if(t.dataset.range){S.prefs[t.dataset.range]=Number(t.value);$('#out-'+t.dataset.range).textContent=t.value+t.dataset.unit;updateMini();}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.chipForm)return;e.preventDefault();const v=f.elements.value.value.trim(),kind=f.dataset.chipForm;if(!v)return;if(S[kind].includes(v)){toast('已经添加过这个'+(kind==='names'?'称呼':'关键词'));return;}S[kind].push(v);renderRules();toast('已添加演示'+(kind==='names'?'称呼':'关键词'));});
$('#listenToggle').addEventListener('click',()=>{S.running=!S.running;if(!S.running){flowTimers.forEach(clearTimeout);S.phase='idle';}renderNav();toast(S.running?'演示监听已开始':'演示监听已暂停');});
$('#pushDemo').addEventListener('click',pushDemo);
$('#resetDemo').addEventListener('click',()=>{flowTimers.forEach(clearTimeout);S=fresh();document.body.classList.remove('reduced');if($('#modal').open)closeDialog();render();toast('已恢复初始合成数据');});
$('#viewportControls').addEventListener('click',e=>{const b=e.target.closest('[data-size]');if(!b)return;$('#shell').classList.toggle('compact',b.dataset.size==='compact');$('#shell').classList.toggle('phone',b.dataset.size==='phone');$$('[data-size]').forEach(v=>v.classList.toggle('on',v===b));});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
render();
</script>
</body>
</html>
