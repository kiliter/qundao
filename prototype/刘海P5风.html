<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>群岛 · 刘海 P5 风 高保真原型</title>
<style>
:root{--red:#e60012;--red2:#ff2a3d;--blk:#0a0a0a;--wht:#f7f5f0;--gry:#8a8a8a;--snap:cubic-bezier(.7,0,.2,1);--pop:cubic-bezier(.3,1.6,.5,1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:13px/1.45 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;overflow:hidden;color:var(--wht);
  background:radial-gradient(900px 600px at 20% 85%,#5a0a14 0,transparent 60%),radial-gradient(900px 600px at 85% 20%,#26303d 0,transparent 60%),#121418}
.menubar{position:fixed;inset:0 0 auto;height:37px;display:flex;align-items:center;gap:20px;padding:0 18px;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.menubar .r{margin-left:auto;display:flex;gap:16px}
/* 刘海外壳：贴摄像头的一条纯黑 */
.island{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:10;background:#000;overflow:hidden;
  width:var(--w);height:var(--h);border-radius:0 0 var(--r) var(--r);
  transition:width .38s var(--snap),height .38s var(--snap),border-radius .3s}
.island.open{box-shadow:0 20px 60px rgba(0,0,0,.6)}
.bar{height:37px;display:flex;align-items:center;padding:0 10px;cursor:pointer}
.wing{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.cam{width:180px;flex:none}
.btag{font:900 11px/1 -apple-system,"PingFang SC";background:var(--red);color:#fff;padding:3px 7px 3px 6px;transform:skewX(-14deg);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.btag span{display:inline-block;transform:skewX(14deg)}
.bnum{font:900 italic 13px/1 "Helvetica Neue",-apple-system;color:#fff;font-variant-numeric:tabular-nums}
.bnum.zero{color:#666}
.emb{width:16px;height:16px;flex:none}
/* 展开面板 */
.panel{position:relative;display:flex;flex-direction:column;opacity:0;transition:opacity .15s}
.island.open .panel{opacity:1;transition-delay:.12s}
.bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bg .slash{position:absolute;right:-60px;top:-30px;width:300px;height:150px;background:var(--red);transform:rotate(-14deg);clip-path:polygon(18% 0,100% 0,100% 100%,0 72%)}
.bg .slash2{position:absolute;right:30px;top:96px;width:120px;height:10px;background:#fff;transform:rotate(-14deg)}
.bg .dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.07) 1.2px,transparent 1.5px) 0 0/8px 8px;
  -webkit-mask:linear-gradient(200deg,#000 0,transparent 55%);mask:linear-gradient(200deg,#000 0,transparent 55%)}
.bg .stripe{position:absolute;left:-40px;bottom:30px;width:200px;height:220px;background:repeating-linear-gradient(-55deg,rgba(230,0,18,.14) 0 6px,transparent 6px 16px);clip-path:polygon(0 30%,100% 0,70% 100%,0 100%)}
.panel>*:not(.bg):not(.cutin){position:relative}
/* 头部：剪报字标题 + 状态徽章 */
.head{display:flex;align-items:flex-start;padding:12px 14px 6px;gap:10px;height:82px}
.ransom{display:flex;align-items:flex-end;gap:2px;margin-top:2px}
.ransom i{font-style:normal;font-weight:900;display:inline-block;line-height:1;padding:3px 4px}
.ransom i:nth-child(1){background:#fff;color:#000;font-size:19px;transform:rotate(-6deg)}
.ransom i:nth-child(2){background:#000;color:#fff;font-size:15px;transform:rotate(4deg) translateY(-2px);outline:2px solid #fff}
.ransom i:nth-child(3){background:var(--red);color:#fff;font-size:20px;transform:rotate(-3deg) translateY(1px)}
.ransom i:nth-child(4){background:#fff;color:var(--red);font-size:16px;transform:rotate(7deg);font-family:"Songti SC",serif}
.star{position:relative;width:42px;height:42px;margin-left:4px;display:grid;place-items:center;flex:none}
.star svg{position:absolute;inset:0;animation:spinS 12s linear infinite}
@keyframes spinS{to{transform:rotate(360deg)}}
.star b{position:relative;font:900 italic 17px/1 "Helvetica Neue",-apple-system;color:#fff;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 #000}
.hr{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:7px;z-index:2}
.hbtns{display:flex;gap:4px}
.ib{width:24px;height:22px;border:0;background:#000;color:#fff;cursor:pointer;font-size:11px;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%)}
.ib:hover,.ib.on{background:#fff;color:#000}
.allread{border:0;cursor:pointer;background:#000;color:#fff;font:900 11px/1 -apple-system,"PingFang SC";padding:6px 14px 6px 12px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);letter-spacing:1px}
.allread:hover{background:#fff;color:var(--red)}.allread:disabled{opacity:.35;pointer-events:none}
/* 状态条 */
.status{margin:0 14px 8px;height:34px;display:flex;align-items:center;gap:10px}
.state{position:relative;display:flex;align-items:center;gap:8px;height:30px;padding:0 14px 0 10px;background:#fff;color:#000;
  clip-path:polygon(0 0,100% 0,94% 100%,3% 100%);animation:slam .32s var(--snap)}
.state b{font:900 13px/1 -apple-system,"PingFang SC";letter-spacing:1px}
.state small{font-size:10.5px;color:#444;font-variant-numeric:tabular-nums;white-space:nowrap}
.state.hot{background:var(--red);color:#fff}.state.hot small{color:#ffd9dc}
@keyframes slam{0%{clip-path:polygon(0 0,0 0,0 100%,0 100%)}100%{clip-path:polygon(0 0,100% 0,94% 100%,3% 100%)}}
.pipe{display:flex;gap:3px;margin-left:auto}
.chev{height:22px;padding:0 12px;display:grid;place-items:center;font:800 10px/1 -apple-system,"PingFang SC";color:#777;background:#1d1d1d;
  clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%,14% 50%);white-space:nowrap}
.chev:first-child{clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%)}
.chev.on{background:var(--red);color:#fff;animation:throb .9s ease-in-out infinite}
.chev.done{background:#3a3a3a;color:#bbb}
@keyframes throb{50%{filter:brightness(1.25)}}
.meter{margin:-4px 14px 8px;height:3px;background:#222;transform:skewX(-30deg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);transition:width .2s linear}
/* 列表 */
.list{max-height:calc(100vh - 260px);overflow-y:auto;padding:6px 18px 14px 16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.card{position:relative;cursor:pointer;color:#111;padding:12px 16px 12px 18px;transition:transform .18s var(--pop),opacity .25s,max-height .3s,padding .3s,margin .3s;max-height:600px}
.card::before{content:"";position:absolute;inset:0;background:var(--wht);transform:skewX(-5deg) rotate(var(--rot,0deg));box-shadow:5px 5px 0 var(--red);transition:background .15s,box-shadow .18s}
.card:nth-child(even){--rot:.6deg}.card:nth-child(odd){--rot:-.5deg}
.card>*{position:relative}
.card:hover,.card.hov{transform:translateX(-4px)}
.card:hover::before,.card.hov::before{background:#000;box-shadow:7px 7px 0 var(--red),-3px -3px 0 #fff}
.card:hover,.card.hov{color:#fff}
.card:hover .older,.card.hov .older{color:#9a9a9a}
.card.hov .e,.card:hover .e{color:#eee}
.card.updating::after{content:"";position:absolute;inset:0;transform:skewX(-5deg);pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(230,0,18,.22) 50%,transparent 70%) 0 0/250% 100%;animation:scan 1.1s linear infinite}
@keyframes scan{from{background-position:150% 0}to{background-position:-50% 0}}
.card.leaving{animation:cut .38s var(--snap) forwards}
@keyframes cut{0%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}100%{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%);transform:translateX(30px)}}
.card.gone{max-height:0;padding-top:0;padding-bottom:0;margin-top:-14px;opacity:0}
.card.entering{animation:dash .45s var(--snap)}
@keyframes dash{from{transform:translateX(-120%) skewX(-12deg);opacity:0}}
.stamp{position:absolute;right:20px;top:50%;font:900 22px/1 -apple-system,"PingFang SC";color:var(--red);border:3px solid var(--red);padding:4px 10px;transform:translateY(-50%) rotate(-12deg) scale(2);opacity:0;z-index:3}
.leaving .stamp{animation:stamp .2s var(--pop) forwards}
@keyframes stamp{to{transform:translateY(-50%) rotate(-12deg) scale(1);opacity:1}}
.top{display:flex;align-items:center;gap:10px;height:28px}
.av{width:30px;height:30px;flex:none;display:grid;place-items:center;font:900 14px/1 -apple-system,"PingFang SC";background:#000;color:#fff;
  clip-path:polygon(10% 0,100% 6%,90% 100%,0 92%);outline:none}
.card:hover .av,.card.hov .av{background:var(--red)}
.name{font:900 13.5px/1 -apple-system,"PingFang SC";white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.num{font:900 italic 11px/1 "Helvetica Neue",-apple-system;background:var(--red);color:#fff;padding:3px 7px;transform:skewX(-14deg)}
.upd{display:none;font:900 10px/1 -apple-system,"PingFang SC";color:var(--red);letter-spacing:1px;white-space:nowrap;align-items:center;gap:4px}
.updating .upd{display:flex}.upd i{width:6px;height:6px;background:var(--red);transform:rotate(45deg);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.sp{flex:1}
.right{position:relative;min-width:76px;height:24px;display:flex;align-items:center;justify-content:flex-end}
.time{font:800 italic 11px/1 "Helvetica Neue",-apple-system;color:#666;font-variant-numeric:tabular-nums}
.read{position:absolute;right:-4px;border:0;cursor:pointer;background:var(--red);color:#fff;font:900 11px/1 -apple-system,"PingFang SC";padding:6px 14px 6px 10px;
  clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%,8% 50%);opacity:0;pointer-events:none;transform:translateX(8px);transition:.15s var(--snap);white-space:nowrap;letter-spacing:1px}
.read:hover{background:#fff;color:#000}
.card:hover .time,.card.hov .time{opacity:0}.card:hover .read,.card.hov .read{opacity:1;pointer-events:auto;transform:none}
.entries{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.e{font-size:11.8px;line-height:1.6;color:#1a1a1a}
.multi .e{padding-left:10px;border-left:3px solid #000}
.multi .e:first-child{border-left-color:var(--red)}
.card:hover .multi .e,.card.hov .multi .e{border-left-color:#555}.card:hover .multi .e:first-child,.card.hov .multi .e:first-child{border-left-color:var(--red)}
.e.older{color:#666}
.et{display:flex;align-items:center;gap:6px;font:800 italic 10px/1.4 "Helvetica Neue",-apple-system;color:#777}
.new{font:900 9px/1 -apple-system;background:#000;color:#fff;padding:2px 5px;transform:skewX(-14deg) rotate(-3deg);letter-spacing:1px}
.card:hover .new,.card.hov .new{background:var(--red)}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font:900 10px/1 -apple-system,"PingFang SC";padding:4px 8px;letter-spacing:.5px}
.k-at{background:var(--red);color:#fff;transform:rotate(-3deg);clip-path:polygon(0 8%,100% 0,96% 100%,4% 92%)}
.k-re{background:#000;color:#fff;transform:rotate(2deg);outline:1.5px solid #000}
.card:hover .k-re,.card.hov .k-re{background:#fff;color:#000}
.more{border:0;background:none;cursor:pointer;font:800 10.5px/1 -apple-system,"PingFang SC";color:var(--red);text-align:left;padding:2px 0 0;letter-spacing:.5px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 0 24px}
.empty .big{font:900 26px/1 -apple-system,"PingFang SC";background:#fff;color:#000;padding:6px 14px;transform:rotate(-4deg);box-shadow:6px 6px 0 var(--red)}
.empty small{color:#999;font-size:11px}
.foot{height:34px;display:flex;align-items:center;padding:0 16px;font-size:10.5px;color:#999;border-top:2px solid #1c1c1c}
.foot a{color:#fff;text-decoration:none;font:900 11px/1 -apple-system,"PingFang SC";background:var(--red);padding:5px 12px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
/* 新关注插播 */
.cutin{position:absolute;left:-10%;right:-10%;top:42%;height:64px;z-index:5;pointer-events:none;display:none;align-items:center;justify-content:center;
  background:var(--red);transform:rotate(-8deg);box-shadow:0 0 0 6px #000,0 0 0 9px #fff}
.cutin b{font:900 28px/1 -apple-system,"PingFang SC";color:#fff;letter-spacing:4px;text-shadow:3px 3px 0 #000}
.cutin.show{display:flex;animation:cutin 1.4s var(--snap) forwards}
@keyframes cutin{0%{transform:translateX(-110%) rotate(-8deg)}18%,78%{transform:translateX(0) rotate(-8deg)}100%{transform:translateX(110%) rotate(-8deg)}}
/* 控制台 */
.ctl{position:fixed;right:20px;bottom:20px;width:272px;padding:14px;background:#f7f5f0;color:#111;box-shadow:6px 6px 0 var(--red);font-size:12px;z-index:20}
.ctl h4{font:900 12px/1 -apple-system,"PingFang SC";margin:10px 0 6px}.ctl h4:first-child{margin-top:0}
.seg{display:flex;flex-wrap:wrap;gap:5px}.seg button{border:0;padding:4px 9px;background:#e4e1da;font:inherit;cursor:pointer}.seg button.on{background:#000;color:#fff}
.ctl label{display:flex;gap:6px;align-items:center;margin-top:4px}
.tip{margin-top:9px;color:#666;font-size:11px;line-height:1.5}
body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="menubar"><b></b><b>Finder</b><span>文件</span><span>编辑</span><span>显示</span><span>前往</span><div class="r"><span>Wi‑Fi</span><span>周三 15:42</span></div></div>

<div class="island" id="island" style="--w:250px;--h:37px;--r:14px">
  <div class="bar" id="bar"><div class="wing" id="wingL"></div><div class="cam"></div><div class="wing" id="wingR"></div></div>
  <div class="panel">
    <div class="bg"><div class="dots"></div><div class="stripe"></div><div class="slash"></div><div class="slash2"></div></div>
    <div class="head">
      <div class="ransom" aria-label="需要关注"><i>需</i><i>要</i><i>关</i><i>注</i></div>
      <div class="star"><svg viewBox="0 0 42 42"><polygon fill="#000" stroke="#fff" stroke-width="2" points="21,1 26,14 40,12 30,22 38,35 24,30 18,41 15,28 2,30 11,20 3,8 16,12"/></svg><b id="total">0</b></div>
      <div class="hr"><div class="hbtns"><button class="ib" id="pin" title="固定刘海">◆</button><button class="ib" id="close" title="收起刘海">▲</button></div>
        <button class="allread" id="readAll">一键已阅</button></div>
    </div>
    <div class="status" id="status"></div>
    <div class="meter" id="meter"><i></i></div>
    <div class="list" id="list"></div>
    <div class="foot"><span id="foot"></span><span class="sp"></span><a href="#">打开主窗口 ▶</a></div>
    <div class="cutin" id="cutin"><b>有人找你！</b></div>
  </div>
</div>

<div class="ctl">
  <h4>处理状态</h4><div class="seg" id="phases"></div>
  <h4>数据</h4><div class="seg" id="datasets"></div>
  <h4>显示</h4>
  <label><input type="checkbox" id="fold"> 同群旧摘要折叠，只露最新一条</label>
  <label><input type="checkbox" id="rm"> 减少动态效果</label>
  <div class="seg" style="margin-top:8px"><button id="push">模拟新摘要到达</button><button id="reset">重置</button></div>
  <div class="tip">悬停卡片：白卡翻黑，出现红色「本群已阅」；点击看斜切移除和印章。「新关注」会有横幅插播。</div>
</div>

<script>
const $=s=>document.querySelector(s);
const SRC={
 three:[
  {id:"g1",n:"产品研发群",e:[["15:42","张工确认明天 10:00 评审接口方案，需要你补充鉴权流程图并在会前发到群里。",[["找你","at"]]],
    ["14:05","测试反馈签名页在 iPad 上错位，已定位为字体缓存问题，今晚出修复包。",[]],["11:20","周会改到周四下午，议题包括灰度发布计划和下季度排期。",[]]]},
  {id:"g2",n:"项目交付对接",e:[["14:58","客户要求本周五前给出部署清单，@所有人 确认各自负责模块的上线时间。",[["@所有人","at"],["需回应","re"]]]]},
  {id:"g3",n:"运维值班",e:[["13:10","凌晨 Oracle 连接超时告警两次，已临时扩容连接池，今天继续观察。",[]],["09:32","生产证书将于下周二到期，需要有人申请续签。",[["需回应","re"]]]]},
  {id:"g4",n:"市场部 · 活动筹备",e:[["12:47","发布会彩排时间定在周五 14:00，请技术同学提前准备演示环境。",[["需回应","re"]]]]}],
 one:[{id:"g2",n:"项目交付对接",e:[["14:58","客户要求本周五前给出部署清单，@所有人 确认各自负责模块的上线时间。",[["@所有人","at"],["需回应","re"]]]]}],
 empty:[]};
const NEW={id:"g5",n:"财务报销群",e:[["15:44","本月报销单今天 18:00 截止，你还有 2 张发票未提交。",[["找你","at"]]]]};
const PH={idle:"空闲",buffer:"缓冲中",jev:"Jev 判断",cpa:"CPA 摘要",retry:"失败退避",attention:"新关注"};
let S={phase:"idle",data:"three",groups:[],open:false,pinned:false,fold:false,t0:Date.now()};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const count=()=>S.groups.reduce((a,g)=>a+g.e.length,0);
const left=()=>8-((Date.now()-S.t0)/1000)%8;
const STATE={
 idle:()=>["待机","全部处理完毕 · 上次摘要 15:42",false],
 buffer:()=>["蓄力",`缓冲 3 条 · ${left().toFixed(1)}s 后提交`,true],
 jev:()=>["侦察","Jev 判断与你是否相关",true],
 cpa:()=>["出击","产品研发群 · 42 条未读 · 第 1 次请求",true],
 retry:()=>["撤退","12s 后重试 · 进度未推进",false],
 attention:()=>["命中","新增 1 条需要关注",true]};
const STAGE={buffer:0,jev:1,cpa:2,retry:2};
function emblem(p){ // 收起态小徽记：菱形底 + 状态动作
  const c={idle:"#3a3a3a",retry:"#888"}[p]||"#e60012";
  const anim=p==="idle"?"":`<animateTransform attributeName="transform" type="rotate" from="0 8 8" to="${p==="retry"?"-360":"360"} 8 8" dur="${p==="cpa"?".8s":"2.4s"}" repeatCount="indefinite"/>`;
  return `<svg class="emb" viewBox="0 0 16 16"><g>${anim}<polygon points="8,0 10,6 16,8 10,10 8,16 6,10 0,8 6,6" fill="${c}" stroke="#fff" stroke-width="1"/></g></svg>`;
}
function renderBar(){
  const p=S.phase,lab={buffer:`${left().toFixed(0)}s`,jev:"侦察",cpa:"出击",retry:"12s",attention:"+1"}[p];
  $("#wingL").innerHTML=emblem(p)+(!S.open&&lab?`<span class="btag"><span>${lab}</span></span>`:"");
  const n=count();$("#wingR").innerHTML=`${S.pinned?'<span style="color:#e60012;font-size:9px">◆</span>':""}<span class="bnum ${n?"":"zero"}">${n||"—"}</span>`;
}
let lastPhase;
function renderStatus(){
  const [t,d,hot]=STATE[S.phase](),st=STAGE[S.phase],re=lastPhase!==S.phase;lastPhase=S.phase;
  const chev=(i,name)=>`<span class="chev ${st===i?(S.phase==="retry"?"done":"on"):(st>i?"done":"")}">${name}</span>`;
  const html=`<div class="state ${hot?"hot":""}"><b>${t}</b><small>${d}</small></div><div class="pipe">${chev(0,"缓冲")}${chev(1,"Jev")}${chev(2,"CPA")}</div>`;
  if(re)$("#status").innerHTML=html;else{$("#status .state small").textContent=d}
  $("#meter").style.visibility=S.phase==="buffer"?"visible":"hidden";$("#meter i").style.width=(left()/8*100)+"%";
}
function card(g,enter){
  const multi=g.e.length>1&&!S.fold,list=S.fold?g.e.slice(0,1):g.e,upd=S.phase==="cpa"&&g.id==="g1";
  return `<div class="card ${upd?"updating":""} ${enter?"entering":""}" data-id="${g.id}" role="button" tabindex="0" aria-label="${g.n}，${g.e.length} 条待关注">
   <div class="top"><div class="av">${g.n[0]}</div><span class="name">${esc(g.n)}</span>${g.e.length>1?`<span class="num">×${g.e.length}</span>`:""}
    <span class="upd"><i></i>更新中</span><span class="sp"></span>
    <span class="right"><span class="time">${g.e[0][0]}</span><button class="read" data-read="${g.id}">本群已阅</button></span></div>
   <div class="entries ${multi?"multi":""}">${list.map((x,i)=>`<div class="e ${i?"older":""}">
     ${multi?`<div class="et">${i===0?'<span class="new">NEW</span>':""}${x[0]}</div>`:""}${esc(x[1])}
     ${x[2].length?`<div class="tags">${x[2].map(t=>`<span class="tag k-${t[1]}">${t[0]}</span>`).join("")}</div>`:""}</div>`).join("")}
     ${S.fold&&g.e.length>1?`<button class="more">▶ 还有 ${g.e.length-1} 条较早摘要</button>`:""}</div>
   <div class="stamp">已阅</div></div>`;
}
function renderList(enterId){
  $("#total").textContent=count();$("#readAll").disabled=!S.groups.length;
  $("#list").innerHTML=S.groups.length?S.groups.map(g=>card(g,g.id===enterId)).join(""):
   `<div class="empty"><div class="big">全部清空</div><small>白名单群有新动向会第一时间出现在这里</small></div>`;
  $("#foot").textContent=`待阅 ${count()} · ${S.groups.length} 个群`;
  layout();
}
function layout(){
  const isl=$("#island");
  if(!S.open){isl.classList.remove("open");isl.style.setProperty("--w",(S.phase==="idle"?250:300)+"px");isl.style.setProperty("--h","37px");isl.style.setProperty("--r","14px");renderBar();return}
  isl.classList.add("open");isl.style.setProperty("--w","440px");isl.style.setProperty("--r","22px");
  isl.style.setProperty("--h",Math.min(37+$(".panel").scrollHeight,innerHeight-40)+"px");renderBar();
}
function seg(){
  $("#phases").innerHTML=Object.entries(PH).map(([k,v])=>`<button class="${S.phase===k?"on":""}" data-p="${k}">${v}</button>`).join("");
  $("#datasets").innerHTML=[["three","4 个群"],["one","1 个群"],["empty","无内容"]].map(([k,v])=>`<button class="${S.data===k?"on":""}" data-d="${k}">${v}</button>`).join("");
}
function all(enterId){seg();renderStatus();renderList(enterId)}
function cutin(){const c=$("#cutin");c.classList.remove("show");void c.offsetWidth;c.classList.add("show")}
const isl=$("#island");let closeT;
isl.onmouseenter=()=>{clearTimeout(closeT);if(!S.open){S.open=true;layout()}};
isl.onmouseleave=()=>{if(S.pinned)return;closeT=setTimeout(()=>{S.open=false;layout()},350)};
$("#bar").onclick=()=>{S.pinned=!S.pinned;S.open=true;$("#pin").classList.toggle("on",S.pinned);layout()};
$("#pin").onclick=()=>{S.pinned=!S.pinned;$("#pin").classList.toggle("on",S.pinned);renderBar()};
$("#close").onclick=()=>{S.pinned=false;S.open=false;layout()};
function remove(el,after){el.classList.add("leaving");setTimeout(()=>{el.classList.add("gone")},300);setTimeout(after,560)}
$("#readAll").onclick=()=>{const cs=[...document.querySelectorAll(".card")];cs.forEach((c,i)=>setTimeout(()=>c.classList.add("leaving"),i*80));setTimeout(()=>{S.groups=[];all()},cs.length*80+420)};
$("#list").addEventListener("click",e=>{
  const r=e.target.closest("[data-read]");
  if(r){e.stopPropagation();remove(r.closest(".card"),()=>{S.groups=S.groups.filter(g=>g.id!==r.dataset.read);all()});return}
  if(e.target.closest(".more")){S.fold=false;$("#fold").checked=false;all()}
});
document.addEventListener("click",e=>{const d=e.target.dataset;
  if(d.p){S.phase=d.p;S.t0=Date.now();all();if(d.p==="attention"&&S.open)cutin()}
  if(d.d){S.data=d.d;S.groups=JSON.parse(JSON.stringify(SRC[d.d]));all()}});
$("#fold").onchange=e=>{S.fold=e.target.checked;all()};
$("#rm").onchange=e=>document.body.classList.toggle("rm",e.target.checked);
$("#push").onclick=()=>{if(!S.groups.some(g=>g.id==="g5"))S.groups.unshift(JSON.parse(JSON.stringify(NEW)));S.phase="attention";all("g5");if(S.open)cutin()};
$("#reset").onclick=()=>{S.fold=false;$("#fold").checked=false;S.phase="idle";S.data="three";S.groups=JSON.parse(JSON.stringify(SRC.three));all()};
setInterval(()=>{if(S.phase==="buffer"){renderBar();if(S.open)renderStatus()}},200);
const q=new URLSearchParams(location.hash.slice(1));
// 截图参数只接受本原型已有选项，非法值回到默认演示。
const choice=(values,key,fallback)=>Object.prototype.hasOwnProperty.call(values,key)?key:fallback;
S.phase=choice(PH,q.get("phase"),"idle");S.data=choice(SRC,q.get("data"),"three");S.groups=JSON.parse(JSON.stringify(SRC[S.data]));
if(q.has("fold")){S.fold=true;$("#fold").checked=true}
if(q.has("open")){S.open=true;S.pinned=true;isl.style.transition="none"}
all();
if(q.get("hover"))[...document.querySelectorAll("[data-id]")].find(el=>el.dataset.id===q.get("hover"))?.classList.add("hov");
if(q.has("cut")){const c=$("#cutin");c.classList.add("show");c.style.animation="none";c.style.transform="rotate(-8deg)"}
</script>
</body></html>
