function render(){let h='';if(state.page==='attention'){h=head('留意重要的，其余交给群岛。','这里是可能需要你回应的消息。',`<span class="tag">今天 · 10 月 21 日</span>`)+`<div class="overview"><section><div class="sectiontitle">需要你看一眼 <small>${state.items.length} 条待关注</small></div>${state.items.length?state.items.map(i=>card(i)).join(''):'<div class="card empty">✓<br>暂时没有待关注消息<br><small>有人找你时，会出现在这里。</small></div>'}<p class="note">“已处理”仅更新群岛状态，不改变微信未读状态。</p></section><section><div class="sectiontitle">这一刻，群里在聊什么 <small>15:30—15:45</small></div><div class="summaryhero"><span class="tag">✧ 本轮摘要</span><h3>上线安排正在推进，<br>有一处时间等待确认。</h3><p>已整理 6 个群的 86 条新消息<br>下次摘要 · 15:45</p></div>${summaryRows()}<button class="textbutton" data-goto="summary">查看完整摘要 →</button></section></div>`}

if(state.page==='groups'){h=head('监听群聊','只关注你选中的群，随时调整。',`<span class="tag" id="selectedGroups">已选择 ${state.enabled.size} 个群</span>`)+`<input class="field search" id="groupSearch" placeholder="搜索群名称…" aria-label="搜索群名称"><div class="settinggroup" id="groupList">${state.groups.map((g,i)=>`<div class="settingrow" data-groupname="${g}"><div class="groupname"><span class="avatar">${g[0]}</span><div><strong>${g}</strong><small>${[32,21,18,14,1,0][i]} 条新消息 · ${i<2?'重点关注':'常规关注'}</small></div></div><button class="switch ${state.enabled.has(g)?'on':''}" role="switch" aria-checked="${state.enabled.has(g)}" data-group="${g}" aria-label="监听${g}"></button></div>`).join('')}</div><p class="note">关闭后停止分析该群的新消息，已有提醒仍会保留。</p>`}
if(state.page==='rules'){h=head('让群岛更懂，谁在找你。','明确提及立即提醒，模糊表达结合上下文判断。','<button class="primarylight" id="saveRules">保存规则</button>')+`<h2>我的称呼</h2><div class="settinggroup"><div class="settingrow"><div><strong>这些名字，都可能是在叫我</strong><small>建议加入姓名、群昵称和同事常用的称呼</small><div class="chips" data-chips="names"></div></div></div></div><h2>关注关键词</h2><div class="settinggroup"><div class="settingrow"><div><strong>我负责的事情</strong><small>命中后交给 AI 判断是否需要你回应，不直接产生提醒</small><div class="chips" data-chips="keywords"></div></div></div></div><h2>识别方式</h2><div class="settinggroup"><div class="settingrow"><div><strong>@ 我时立即提醒</strong><small>明确提及优先展示，不等待周期摘要</small></div>${toggle('@ 我时立即提醒')}</div><div class="settingrow"><div><strong>判断隐含求助与催办</strong><small>结合上下文和关键词，识别“没有 @ 但在等我”的消息</small></div>${toggle('判断隐含求助与催办')}</div><div class="settingrow"><div><strong>提醒灵敏度</strong><small>平衡模式会将不确定消息放入摘要</small></div><select class="field" aria-label="提醒灵敏度"><option>平衡 · 推荐</option><option>谨慎 · 仅高置信度</option><option>敏感 · 减少遗漏</option></select></div></div>`}
if(state.page==='appearance'){h=head('轻轻出现，适时提醒。','把重要信息放在刘海，把专注留给你。')+`<h2>刘海交互</h2><div class="settinggroup"><div class="settingrow"><div><strong>鼠标悬停展开</strong><small>移开自动收起；点击刘海可固定面板</small></div>${toggle('鼠标悬停展开',state.hover,'hoverSetting')}</div><div class="settingrow"><div><strong>新提醒自动展开</strong><small>短暂展示提醒卡片，随后自动收起</small></div>${toggle('新提醒自动展开',true,'autoExpand')}</div><div class="settingrow"><div><strong>外接显示器</strong><small>没有刘海时，在屏幕顶部居中显示悬浮岛</small></div><span class="tag">顶部居中</span></div></div><h2>通知</h2><div class="settinggroup"><div class="settingrow"><div><strong>系统通知</strong><small>重要消息同时出现在通知中心</small></div>${toggle('系统通知')}</div><div class="settingrow"><div><strong>通知隐藏消息正文</strong><small>只显示群名称和“有人找你”</small></div>${toggle('通知隐藏消息正文',false)}</div><div class="settingrow"><div><strong>免打扰</strong><small>继续整理摘要，暂停弹出提醒</small></div>${toggle('免打扰',state.dnd,'dndSetting')}</div></div><button class="primarylight" id="previewIsland">预览刘海效果</button>`}
if(state.page==='connection'){h=head('连接你的消息与模型','配置完成后，群岛就能在后台帮你留意。')+`<h2>消息来源 · Alpha</h2><div class="settinggroup"><div class="settingrow"><div><strong>服务地址</strong><small>本机 Alpha 服务</small></div><input class="field" value="http://127.0.0.1:9527" aria-label="服务地址"></div><div class="settingrow"><div><strong>访问令牌</strong><small>正式应用使用 macOS 钥匙串保存</small></div><input class="field" type="password" placeholder="输入访问令牌" autocomplete="off" aria-label="访问令牌"></div><div class="settingrow"><div><strong id="connectionState">${state.offline?'连接中断':'演示连接正常'}</strong><small>原型不会请求真实服务</small></div><button class="pill" id="testConnection">模拟连接测试</button></div></div><h2>大模型</h2><div class="settinggroup"><div class="settingrow"><div><strong>接口类型</strong><small>可配置兼容服务或本地模型</small></div><select class="field" aria-label="模型接口类型"><option>OpenAI 兼容接口</option><option>本地模型</option></select></div><div class="settingrow"><strong>接口地址</strong><input class="field" placeholder="https://…/v1" aria-label="模型接口地址"></div><div class="settingrow"><strong>API Key</strong><input class="field" type="password" placeholder="输入模型密钥" autocomplete="off" aria-label="模型密钥"></div><div class="settingrow"><strong>模型名称</strong><input class="field" placeholder="输入模型 ID" aria-label="模型名称"></div></div><p class="note">使用远端模型时，选中群的必要消息上下文将发送至你配置的服务。此原型不保存令牌或模型密钥。</p>`}
$('#content').innerHTML=h;$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===state.page));$('#breadcrumb').textContent=(['attention','summary','groups'].includes(state.page)?'工作空间':'偏好设置')+' / '+$(`.nav[data-page="${state.page}"] .label`).textContent;renderChips();bindContent();sync();}
function renderChips(){$$('[data-chips]').forEach(el=>{let key=el.dataset.chips;el.innerHTML=state[key].map((x,i)=>`<span class="chip">${escapeHTML(x)}<button data-remove="${key}:${i}" aria-label="移除${escapeHTML(x)}">×</button></span>`).join('')+`<input class="taginput" data-add="${key}" placeholder="＋ 输入后按回车" aria-label="添加${key==='names'?'称呼':'关键词'}">`})}
function bindContent(){$('#groupSearch')?.addEventListener('input',e=>$$('[data-groupname]').forEach(el=>el.hidden=!el.dataset.groupname.includes(e.target.value)));$('#saveRules')?.addEventListener('click',()=>{localStorage.setItem('qundao-demo-rules',JSON.stringify({names:state.names,keywords:state.keywords}));toast('规则已保存在此浏览器，仅用于原型演示')});$('#refreshSummary')?.addEventListener('click',e=>{e.target.disabled=true;e.target.textContent='正在整理…';setTimeout(()=>{e.target.disabled=false;e.target.textContent='✧ 立即生成';$('#summaryStatus').textContent='刚刚更新 · 演示摘要';toast('演示摘要已更新')},900)});$('#previewIsland')?.addEventListener('click',()=>openIsland(true));$('#testConnection')?.addEventListener('click',()=>{$('#connectionState').textContent=state.offline?'演示连接失败，请先恢复连接':'演示连接正常';toast('仅模拟测试，未访问真实服务')})}
function sync(){$$('.pendingCount').forEach(el=>el.textContent=state.items.length);$('#islandCount').textContent=state.items.length?state.items.length+' 条找你':'暂无待办';let label=state.offline?'连接中断':state.paused?'已暂停':state.dnd?'免打扰':'正在关注';$('#islandStatus').textContent=label;$('#menuState').textContent=label;$('#sideState').textContent=state.offline?'Alpha 连接中断':state.paused?'监听已暂停':'Alpha 已连接 · 演示';$('#footerConnection').textContent=state.offline?'● 连接中断 · 恢复后补查消息':state.paused?'Ⅱ 监听已暂停':'● 实时监听中 · 演示环境';$('#islandFoot').textContent=state.offline?'连接中断 · 恢复后补查':`${state.enabled.size} 个群 · ${state.paused?'已暂停':'刚刚同步'}`;$('#groupBadge').textContent=state.enabled.size;$('#pause').innerHTML=state.paused?'恢复监听 <small>▶</small>':'暂停监听 <small>Ⅱ</small>';$('#toolbarPause').textContent=state.paused?'▶ 恢复监听':'Ⅱ 暂停监听';$('#dnd').innerHTML=state.dnd?'关闭免打扰 <small>☾</small>':'免打扰 1 小时 <small>☾</small>';renderIsland()}
function renderIsland(){$$('[data-islandtab]').forEach(b=>b.classList.toggle('active',b.dataset.islandtab===state.tab));$('#islandContent').innerHTML=state.tab==='attention'?(state.items.length?state.items.map(i=>card(i,true)).join(''):'<div class="empty">✓ 暂时没有需要回应的消息<br><small>你可以继续专注了。</small></div>'):'<div class="darkcard"><div class="meta"><span>✧ 15:30—15:45</span><span>86 条 → 3 件事</span></div><p>上线时间等待你确认。<br>签字接口有人询问联调进度。<br>测试组已确认周五进行回归。</p><div class="actions"><button data-goto="summary">查看完整摘要 ↗</button></div></div>'}
function openIsland(pin=false){clearTimeout(closeTimer);if(pin)state.pinned=true;$('#island').classList.add('open');$('#islandToggle').setAttribute('aria-expanded','true');$('#pin').textContent=state.pinned?'已固定 · 点击收起':'点击固定 ◇'}function closeIsland(){state.pinned=false;$('#island').classList.remove('open');$('#islandToggle').setAttribute('aria-expanded','false')}function go(p){state.page=p;$('#window').classList.remove('hidden');$('#quickMenu').classList.remove('open');closeIsland();render();$('#content').scrollTop=0}function pause(){state.paused=!state.paused;sync();toast(state.paused?'已暂停监听，已有摘要仍可查看':'已恢复监听 · 演示')}
function detail(id){let i=state.items.find(x=>x.id===id)||{...state.items[0],group:'产品研发协作群',name:'林悦',text:'@嘉林 明天的上线时间能帮忙确认一下吗？',reason:'明确 @ 你',id:1};closeIsland();$('#modal').innerHTML=`<div class="modalhead"><div><h2>${i.group}</h2><p class="note" style="margin:5px 0 0">消息上下文 · 演示内容</p></div><button id="closeModal" aria-label="关闭上下文">✕</button></div><div class="meta">王晨 · 15:32</div><div class="chatbubble">这边准备已经完成，确认时间后就可以安排下一步。</div><div class="meta">${i.name} · 15:38</div><div class="chatbubble" style="background:#e9edfc">${i.text}</div><div class="summaryhero"><span class="tag">为什么提醒你</span><p style="margin-top:9px">${i.reason}。判断仅基于当前可见的消息。</p></div><div class="actions"><button data-done="${i.id}">✓ 标记已处理</button><button data-later="${i.id}">15 分钟后提醒</button><button id="copyMessage">复制消息</button></div>`;$('#modalback').classList.add('open');$('#closeModal').onclick=()=>$('#modalback').classList.remove('open');$('#copyMessage').onclick=async()=>{try{await navigator.clipboard.writeText(i.text);toast('消息已复制')}catch{toast('浏览器未授权剪贴板，可在上方选择文字复制')}}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)go(b.dataset.page);if(b.dataset.goto)go(b.dataset.goto);if(b.dataset.islandtab){state.tab=b.dataset.islandtab;renderIsland()}if(b.dataset.detail)detail(+b.dataset.detail);if(b.dataset.done||b.dataset.later){let id=+(b.dataset.done||b.dataset.later);state.items=state.items.filter(i=>i.id!==id);$('#modalback').classList.remove('open');render();toast(b.dataset.done?'已标记处理，不改变微信未读状态':'已移入稍后提醒 · 15 分钟（原型模拟）')}if(b.dataset.remove){let [key,i]=b.dataset.remove.split(':');state[key].splice(+i,1);renderChips()}if(b.classList.contains('switch')){b.classList.toggle('on');let on=b.classList.contains('on');b.setAttribute('aria-checked',String(on));if(b.dataset.group){on?state.enabled.add(b.dataset.group):state.enabled.delete(b.dataset.group);$('#selectedGroups').textContent=`已选择 ${state.enabled.size} 个群`;sync()}if(b.id==='hoverSetting')state.hover=on;if(b.id==='dndSetting'){state.dnd=on;sync()}if(b.id==='autoExpand')state.autoExpand=on;toast(on?'已开启（原型）':'已关闭（原型）')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.add){let v=e.target.value.trim(),key=e.target.dataset.add;if(v&&!state[key].includes(v)){state[key].push(v);renderChips();$(`[data-add="${key}"]`).focus()}else toast('请输入不重复的内容')}if(e.key==='Escape'){closeIsland();$('#quickMenu').classList.remove('open');$('#modalback').classList.remove('open')}});
$('#island').onmouseenter=()=>{if(state.hover)openIsland()};$('#island').onmouseleave=()=>{if(!state.pinned)closeTimer=setTimeout(closeIsland,450)};$('#islandToggle').onclick=()=>{if(state.pinned)closeIsland();else openIsland(true)};$('#pin').onclick=()=>state.pinned?closeIsland():openIsland(true);$('#openMain').onclick=()=>go('attention');$('#demoIsland').onclick=()=>$('#island').classList.contains('open')?closeIsland():openIsland(true);$('#menuToggle').onclick=()=>$('#quickMenu').classList.toggle('open');$('#menuOpen').onclick=()=>go('attention');$('#menuSummary').onclick=()=>{state.tab='summary';$('#quickMenu').classList.remove('open');openIsland(true)};$('#menuSettings').onclick=()=>go('rules');$('#menuHide').onclick=()=>{$('#window').classList.add('hidden');$('#quickMenu').classList.remove('open')};$('#closeWin').onclick=$('#minWin').onclick=()=>{$('#window').classList.add('hidden');toast('窗口已隐藏，可通过菜单栏重新打开')};$('#zoomWin').onclick=()=>{const el=$('#window');el.style.width=el.style.width?'':'96vw'};$('#pause').onclick=$('#toolbarPause').onclick=pause;$('#dnd').onclick=()=>{state.dnd=!state.dnd;sync();toast(state.dnd?'免打扰已开启 · 演示 1 小时':'已关闭免打扰')};$('#demoDisconnect').onclick=()=>{state.offline=!state.offline;$('#demoDisconnect').textContent=state.offline?'⇄ 恢复连接':'⇄ 模拟断线';sync();toast(state.offline?'连接中断，刘海保留连接状态':'连接已恢复，正在模拟补查遗漏消息');if(state.page==='connection')render()};$('#demoMessage').onclick=()=>{if(state.paused||state.offline){toast(state.paused?'请先恢复监听，再模拟新消息':'请先恢复连接，再模拟新消息');return}state.items.unshift({id:Date.now(),group:'客户需求沟通',avatar:'客',name:'周宁',time:'刚刚',title:'请你确认需求说明',text:'@嘉林 需求说明已经更新，方便帮忙看一下范围有没有遗漏吗？',reason:'明确 @ 你 · 请求确认需求范围',type:'明确找我'});state.tab='attention';render();if(!state.dnd&&state.autoExpand!==false){openIsland();clearTimeout(closeTimer);closeTimer=setTimeout(()=>{if(!state.pinned&&!$('#island').matches(':hover'))closeIsland()},5500)}toast(state.dnd?'已收集新提醒，免打扰期间不弹出':'收到一条明确找你的消息 · 演示')};$('#demoReset').onclick=()=>{localStorage.removeItem('qundao-demo-rules');location.reload()};$('#modalback').onclick=e=>{if(e.target===$('#modalback'))$('#modalback').classList.remove('open')};document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu,.menubtn'))$('#quickMenu').classList.remove('open')});try{const saved=JSON.parse(localStorage.getItem('qundao-demo-rules'));if(saved){state.names=saved.names;state.keywords=saved.keywords}}catch{}render();
</script></body></html>
